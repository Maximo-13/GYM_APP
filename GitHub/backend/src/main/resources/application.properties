spring.application.name=backend

# Base de datos (MySQL / MariaDB de XAMPP por defecto).
# En producción se sobreescriben con las variables de entorno DB_URL, DB_USER y DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gym_app?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Flyway crea y versiona las tablas (src/main/resources/db/migration).
spring.flyway.enabled=true

# Hibernate solo valida que las entidades coincidan con las tablas; nunca las modifica.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Sesiones: JWT firmado con esta clave (mínimo 32 caracteres).
# En producción se define con la variable de entorno JWT_SECRET; nunca la de desarrollo.
gymapp.jwt.secret=${JWT_SECRET:clave-solo-para-desarrollo-cambiala-en-produccion-123456}
gymapp.jwt.dias=30

# Client ID de Google (OAuth) separados por comas: el de tipo Web y el de Android.
# Vacío = el inicio de sesión con Google responde "no configurado".
gymapp.google.client-ids=${GOOGLE_CLIENT_IDS:}

# Orígenes que pueden llamar a la API: navegador (ng serve) y la app en Android/iOS.
gymapp.cors.origenes=${CORS_ORIGENES:http://localhost:4200,http://localhost,https://localhost,capacitor://localhost}
