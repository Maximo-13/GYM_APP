spring.application.name=backend

# Base de datos (MySQL / MariaDB de XAMPP por defecto).
# En producción se sobreescriben con las variables de entorno DB_URL, DB_USER y DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gym_app?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Flyway crea y versiona las tablas (src/main/resources/db/migration).
spring.flyway.enabled=true

# Hibernate solo valida que las entidades coincidan con las tablas; nunca las modifica.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
